services:
  app:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env
    # Optional: mount data file as a volume so you can swap it without rebuilding
    # volumes:
    #   - "./cortex (2) (1) (2) (1) (1) (3).parquet:/app/cortex (2) (1) (2) (1) (1) (3).parquet:ro"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
